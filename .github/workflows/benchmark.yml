name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run nightly at 6:00 AM UTC
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Run linter
        run: make lint

  benchmark:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Install tools
        run: |
          pip install ruff mypy

      - name: Run quick benchmark
        run: make bench-quick

      - name: Check gates
        run: make check-gates

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30

  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Install tools
        run: |
          pip install ruff mypy

      - name: Run full benchmark
        run: make bench-full

      - name: Check gates
        run: make check-gates

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-results
          path: benchmarks/results/
          retention-days: 90
